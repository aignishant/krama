name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run ruff format --check scripts tests
      - run: uv run ruff check scripts tests
      # The syllabus is data: it must load, tile 1-180, and match what is on disk.
      - run: uv run python scripts/curriculum.py
      - run: uv run pytest -q
      # Every lesson that has been written must satisfy the nine-section contract.
      - run: uv run python scripts/check_day.py
