[project]
name = "krama"
version = "0.1.0"
description = "A 180-day DSA and system design course for product-company interviews."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The syllabus files are a data table, not code. Keeping one day per block is the
# whole point of the format; the formatter would explode it to one field per line.
extend-exclude = ["scripts/syllabus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
